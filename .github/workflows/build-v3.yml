name: Build APK v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply portrait and readable controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/mrlaloo/machinefreezecam/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.graphics.ImageFormat;\n', 'import android.graphics.ImageFormat;\nimport android.graphics.Insets;\nimport android.graphics.Matrix;\nimport android.graphics.Color;\n')
          s = s.replace('import android.os.Bundle;\n', 'import android.os.Build;\nimport android.os.Bundle;\n')
          s = s.replace('import android.view.Surface;\n', 'import android.view.Surface;\nimport android.view.WindowInsets;\n')
          s = s.replace('private Handler cameraHandler;\n', 'private Handler cameraHandler;\n    private int sensorRotationDegrees = 90;\n')
          s = s.replace('root.setPadding(12, 12, 12, 12);', 'final int basePad = 12;\n        root.setPadding(basePad, basePad, basePad, basePad);\n        root.setOnApplyWindowInsetsListener((v, insets) -> {\n            int left, top, right, bottom;\n            if (Build.VERSION.SDK_INT >= 30) {\n                Insets bars = insets.getInsets(WindowInsets.Type.systemBars());\n                left = bars.left; top = bars.top; right = bars.right; bottom = bars.bottom;\n            } else {\n                left = insets.getSystemWindowInsetLeft(); top = insets.getSystemWindowInsetTop();\n                right = insets.getSystemWindowInsetRight(); bottom = insets.getSystemWindowInsetBottom();\n            }\n            v.setPadding(basePad + left, basePad + top, basePad + right, basePad + bottom);\n            return insets;\n        });')
          s = s.replace('b.setText(String.valueOf(p));', 'b.setText(String.valueOf(p));\n            b.setTextColor(Color.WHITE);\n            b.setTextSize(18);')
          s = s.replace('hold.setText("HOLD");', 'hold.setText("HOLD");\n        hold.setTextColor(Color.WHITE);\n        hold.setTextSize(17);')
          s = s.replace('b.setText(label);', 'b.setText(label);\n        b.setTextColor(Color.WHITE);\n        b.setTextSize(17);')
          s = s.replace('presets.addView(b);', 'presets.addView(b, buttonParams());')
          s = s.replace('fine.addView(hold);', 'fine.addView(hold, buttonParams());')
          s = s.replace('parent.addView(b);', 'parent.addView(b, buttonParams());')
          s = s.replace('    private void addAdjust(LinearLayout parent, String label, int amount) {', '    private LinearLayout.LayoutParams buttonParams() {\n        LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 72, 1f);\n        lp.setMargins(4, 4, 4, 4);\n        return lp;\n    }\n\n    private void addAdjust(LinearLayout parent, String label, int amount) {')
          s = s.replace('if (facing != null && facing == CameraCharacteristics.LENS_FACING_BACK) { selected = id; break; }', 'if (facing != null && facing == CameraCharacteristics.LENS_FACING_BACK) {\n                    selected = id;\n                    Integer orientation = manager.getCameraCharacteristics(id).get(CameraCharacteristics.SENSOR_ORIENTATION);\n                    if (orientation != null) sensorRotationDegrees = orientation;\n                    break;\n                }')
          s = s.replace('if (bmp != null) runOnUiThread(() -> imageView.setImageBitmap(bmp));', 'if (bmp != null) {\n                            Bitmap display = rotateForPortrait(bmp);\n                            runOnUiThread(() -> imageView.setImageBitmap(display));\n                        }')
          helper = '    private Bitmap rotateForPortrait(Bitmap source) {\n        if (source == null || sensorRotationDegrees == 0) return source;\n        Matrix matrix = new Matrix();\n        matrix.postRotate(sensorRotationDegrees);\n        Bitmap rotated = Bitmap.createBitmap(source, 0, 0, source.getWidth(), source.getHeight(), matrix, true);\n        if (rotated != source) source.recycle();\n        return rotated;\n    }\n\n'
          s = s.replace('    private void createSession() {', helper + '    private void createSession() {')
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MachineFreezeCam-v3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
