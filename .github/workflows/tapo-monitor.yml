name: Build Tapo Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [ tapo-monitor ]
    paths:
      - 'tapomonitor/**'
      - 'settings.gradle'
      - '.github/workflows/tapo-monitor.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Tapo Monitor debug APK
        run: gradle :tapomonitor:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TapoMonitor-apk
          path: tapomonitor/build/outputs/apk/debug/tapomonitor-debug.apk
