name: Publish Tapo Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [ tapo-monitor ]
    paths:
      - 'tapomonitor/**'
      - '.github/workflows/publish-tapo-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :tapomonitor:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp tapomonitor/build/outputs/apk/debug/tapomonitor-debug.apk TapoMonitor.apk
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tapo-monitor-latest >/dev/null 2>&1 && gh release delete tapo-monitor-latest -y --cleanup-tag || true
          gh release create tapo-monitor-latest TapoMonitor.apk --target "$GITHUB_SHA" --title "Tapo Monitor" --notes "Dedicated local RTSP monitor app for the Tapo C520WS."
